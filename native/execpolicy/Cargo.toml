[package]
name = "pi-guard-execpolicy"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
codex-execpolicy = { git = "https://github.com/openai/codex", rev = "a956835d020762cb2b570053af06f643a11c0ecc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 1
debug = 0
strip = "debuginfo"
