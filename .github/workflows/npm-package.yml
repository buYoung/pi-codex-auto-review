name: npm 배포
on:
  push:
    tags:
      - '**@[0-9]*'
  workflow_dispatch:
    inputs:
      package:
        description: 압축 패키지를 준비할 작업 공간 패키지 이름
        required: true
        type: choice
        default: '@buyong/pi-codex-auto-review'
        options:
          - '@buyong/pi-codex-auto-review'
          - '@buyong/pi-codex-computer-use'
          - '@buyong/pi-codex-fast-mode'
          - '@buyong/pi-codex-image-gen'
          - '@buyong/redact'
permissions:
  contents: read
concurrency:
  group: npm-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: npm 압축 패키지 생성
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - run: npm ci --ignore-scripts
      - name: 릴리스 태그와 버전 확인
        id: release
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          import semver from 'semver';
          import { listPublishablePackages } from './scripts/release-packages.mjs';
          import { readPublishedVersions, verifyPublishedWorkspaceDependencies } from './scripts/release-registry.mjs';
          const isTagPush = process.env.RELEASE_EVENT === 'push';
          const tag = process.env.RELEASE_TAG;
          const packageName = isTagPush ? tag.slice(0, tag.lastIndexOf('@')) : process.env.INPUT_PACKAGE;
          const workspaces = listPublishablePackages(process.cwd());
          const workspace = workspaces.find((candidate) => candidate.name === packageName);
          assert.ok(workspace, `게시할 작업 공간 패키지가 아닙니다: ${packageName}`);
          const manifest = JSON.parse(readFileSync(`${workspace.path}/package.json`, 'utf8'));
          const {name, version} = manifest;
          assert.ok(semver.valid(version) && !semver.parse(version).build.length);
          if (isTagPush) {
            assert.equal(tag, `${name}@${version}`, '태그와 package.json 버전이 다릅니다.');
            execFileSync('git', ['merge-base', '--is-ancestor', 'HEAD', 'origin/master'], {stdio: 'inherit'});
            const publishedVersions = await readPublishedVersions(name);
            assert.ok(publishedVersions.size, `${name}을 먼저 npm에 등록하고 Trusted Publisher를 설정하세요. 등록 절차: docs/publishing.ko.md`);
            assert.ok(!publishedVersions.has(version), `${name}@${version}은 이미 npm에 게시되어 있습니다.`);
            await verifyPublishedWorkspaceDependencies(manifest, new Set(workspaces.map(candidate => candidate.name)));
          }
          const tarball = `${name.replace(/^@/, '').replace('/', '-')}-${version}.tgz`;
          appendFileSync(process.env.GITHUB_OUTPUT, `package=${name}\nversion=${version}\ntarball=${tarball}\nnpm-tag=${semver.prerelease(version) ? 'next' : 'latest'}\n`);
          JS
      - name: 패키지 빌드
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package }}
        run: npm run build -- --filter="$PACKAGE_NAME"
      - if: steps.release.outputs.package == '@buyong/pi-codex-auto-review'
        run: npm run test:policy
      # The test runner loads the evidence validator from the auto-review build.
      - if: steps.release.outputs.package == '@buyong/redact'
        run: npm run build && npm run test:redaction
      - run: mkdir -p tmp/npm
      - name: 압축 패키지 생성
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package }}
        run: npm pack --workspace "$PACKAGE_NAME" --pack-destination tmp/npm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package
          path: tmp/npm/*.tgz
          if-no-files-found: error
    outputs:
      tarball: ${{ steps.release.outputs.tarball }}
      npm-tag: ${{ steps.release.outputs.npm-tag }}
  publish:
    name: npm에 게시
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: npm-package
          path: tmp/npm
      - name: Trusted Publishing에 필요한 npm 버전 확인
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const version = execFileSync('npm', ['--version'], {encoding: 'utf8'}).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          assert.ok(major > 11 || major === 11 && (minor > 5 || minor === 5 && patch >= 1), `npm 11.5.1 이상이 필요합니다: ${version}`);
          JS
      - name: 검증한 압축 패키지 게시
        env:
          TARBALL: ${{ needs.package.outputs.tarball }}
          NPM_TAG: ${{ needs.package.outputs.npm-tag }}
        run: npm publish "tmp/npm/$TARBALL" --access public --tag "$NPM_TAG" --registry=https://registry.npmjs.org/
