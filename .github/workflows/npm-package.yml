name: npm 배포
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: npm 압축 패키지 생성
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - run: npm ci --ignore-scripts
      - name: 릴리스 태그와 버전 확인
        id: release
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          import semver from 'semver';
          const {name, version} = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(name, 'pi-codex-auto-review');
          assert.ok(semver.valid(version) && !semver.parse(version).build.length);
          if (process.env.RELEASE_EVENT === 'push') {
            assert.equal(process.env.RELEASE_TAG, `v${version}`, '태그와 package.json 버전이 다릅니다.');
            execFileSync('git', ['merge-base', '--is-ancestor', 'HEAD', 'origin/master'], {stdio: 'inherit'});
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nnpm-tag=${semver.prerelease(version) ? 'next' : 'latest'}\n`);
          JS
      - run: npm run build
      - run: npm run test:policy
      - run: mkdir -p tmp/npm
      - run: npm pack --pack-destination tmp/npm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package
          path: tmp/npm/*.tgz
          if-no-files-found: error
    outputs:
      version: ${{ steps.release.outputs.version }}
      npm-tag: ${{ steps.release.outputs.npm-tag }}
  publish:
    name: npm에 게시
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: npm-package
          path: tmp/npm
      - name: Trusted Publishing에 필요한 npm 버전 확인
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const version = execFileSync('npm', ['--version'], {encoding: 'utf8'}).trim();
          const [major, minor, patch] = version.split('.').map(Number);
          assert.ok(major > 11 || major === 11 && (minor > 5 || minor === 5 && patch >= 1), `npm 11.5.1 이상이 필요합니다: ${version}`);
          JS
      - name: 검증한 압축 패키지 게시
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          NPM_TAG: ${{ needs.package.outputs.npm-tag }}
        run: npm publish "tmp/npm/pi-codex-auto-review-${PACKAGE_VERSION}.tgz" --access public --tag "$NPM_TAG" --registry=https://registry.npmjs.org/
